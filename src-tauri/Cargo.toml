[package]
name = "multiple-jenkins-build-pipeline-tool"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jenkins_build_pipeline_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：托盘图标与右键菜单；image-png：从 PNG 解码默认窗口图标。
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TLS 选用 native-tls：在 Windows 上直接走系统自带的 Schannel。
# 不用 rustls 是为了避开 aws-lc-sys —— 它需要现编 C 代码，在部分 MSVC 环境下会失败，
# 而 Schannel 不需要额外编译任何东西。
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "cookies",
    "gzip",
    "http2",
    "charset",
    "system-proxy",
    "native-tls",
    # 触发构建要 POST 表单，查队列状态要拼 query 参数。
    "form",
    "query",
] }
tauri-plugin-notification = "2.5.1"
tokio = { version = "1.53.2", features = ["time", "sync", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
# API Token 存进系统凭据管理器（Windows Credential Manager）。
keyring = "4.2.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

